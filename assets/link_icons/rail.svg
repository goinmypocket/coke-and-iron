<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 28">
  <!-- Steam locomotive + coal tender silhouette, drawn so the dark
       parts read against any pawn-colour background. Fixed canvas
       64 × 28 with the locomotive grounded on y = 24. -->

  <defs>
    <linearGradient id="rail-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="rail-wheel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <!-- Coal tender (right) -->
  <rect x="34" y="11" width="26" height="13" rx="1" fill="url(#rail-body)" stroke="#000" stroke-width="0.7"/>
  <!-- Coal lumps in the tender -->
  <circle cx="38" cy="13" r="1.4" fill="#000"/>
  <circle cx="42" cy="12.5" r="1.6" fill="#000"/>
  <circle cx="46" cy="13" r="1.4" fill="#000"/>
  <circle cx="50" cy="12.6" r="1.5" fill="#000"/>
  <circle cx="54" cy="13" r="1.4" fill="#000"/>
  <circle cx="58" cy="12.6" r="1.3" fill="#000"/>

  <!-- Cab -->
  <rect x="22" y="6" width="13" height="18" fill="url(#rail-body)" stroke="#000" stroke-width="0.7"/>
  <!-- Cab window -->
  <rect x="25" y="9" width="7" height="6" fill="#3a3a3a" stroke="#000" stroke-width="0.4"/>
  <!-- Cab roof overhang -->
  <rect x="20" y="5" width="17" height="2" fill="#0a0a0a" stroke="#000" stroke-width="0.4"/>

  <!-- Boiler (cylinder) -->
  <rect x="3" y="11" width="22" height="13" rx="2" fill="url(#rail-body)" stroke="#000" stroke-width="0.7"/>
  <!-- Boiler bands -->
  <line x1="9"  y1="11" x2="9"  y2="24" stroke="#000" stroke-width="0.5"/>
  <line x1="15" y1="11" x2="15" y2="24" stroke="#000" stroke-width="0.5"/>
  <line x1="21" y1="11" x2="21" y2="24" stroke="#000" stroke-width="0.5"/>
  <!-- Smokebox front -->
  <circle cx="5" cy="17.5" r="3" fill="#1a1a1a" stroke="#000" stroke-width="0.5"/>
  <circle cx="5" cy="17.5" r="1.2" fill="#3a3a3a"/>

  <!-- Chimney + steam dome -->
  <rect x="7" y="5" width="3.2" height="6" fill="#0a0a0a" stroke="#000" stroke-width="0.5"/>
  <ellipse cx="8.6" cy="5" rx="2.2" ry="0.8" fill="#0a0a0a" stroke="#000" stroke-width="0.4"/>
  <ellipse cx="14" cy="9" rx="1.8" ry="2" fill="#0a0a0a" stroke="#000" stroke-width="0.4"/>

  <!-- Smoke puffs -->
  <circle cx="8.6" cy="2.6" r="1.8" fill="#bdbdbd" opacity="0.8"/>
  <circle cx="11.5" cy="1.4" r="1.4" fill="#cdcdcd" opacity="0.7"/>
  <circle cx="13.8" cy="2.4" r="1" fill="#dcdcdc" opacity="0.6"/>

  <!-- Wheels (large drivers under the boiler, small under the tender) -->
  <circle cx="7"  cy="24" r="3" fill="url(#rail-wheel)" stroke="#000" stroke-width="0.5"/>
  <circle cx="14" cy="24" r="3" fill="url(#rail-wheel)" stroke="#000" stroke-width="0.5"/>
  <circle cx="21" cy="24" r="3" fill="url(#rail-wheel)" stroke="#000" stroke-width="0.5"/>
  <circle cx="38" cy="25" r="2.2" fill="url(#rail-wheel)" stroke="#000" stroke-width="0.5"/>
  <circle cx="46" cy="25" r="2.2" fill="url(#rail-wheel)" stroke="#000" stroke-width="0.5"/>
  <circle cx="54" cy="25" r="2.2" fill="url(#rail-wheel)" stroke="#000" stroke-width="0.5"/>

  <!-- Wheel hubs -->
  <circle cx="7"  cy="24" r="0.8" fill="#5a5a5a"/>
  <circle cx="14" cy="24" r="0.8" fill="#5a5a5a"/>
  <circle cx="21" cy="24" r="0.8" fill="#5a5a5a"/>
</svg>
