<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 28">
  <!-- Steam locomotive in 3/4 perspective. The boiler is rendered as a
       cylinder with a curved top edge, the cab is a small box at the
       rear, and a coal tender follows behind. Smokebox door is a dark
       disc at the front, chimney + dome stand on top of the boiler.
       Driving wheels are big circles at the front, tender wheels are
       small. White-ish steam puffs trail above the chimney. -->

  <defs>
    <linearGradient id="loco-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="loco-boiler-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="0.5" stop-color="#1f1f1f"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="loco-wheel" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="0.6" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="loco-tender" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <!-- Steam puffs (drawn first, behind chimney) -->
  <g fill="#cdcdcd" opacity="0.85">
    <ellipse cx="9" cy="2.6" rx="2.4" ry="1.6"/>
    <ellipse cx="12.6" cy="1.4" rx="1.7" ry="1.2"/>
  </g>
  <ellipse cx="14.6" cy="2.3" rx="1.1" ry="0.7" fill="#dcdcdc" opacity="0.7"/>

  <!-- ==== Coal tender (right) ==== -->
  <rect x="34" y="11" width="26" height="13" rx="1"
        fill="url(#loco-tender)" stroke="#000" stroke-width="0.6"/>
  <!-- Tender top edge (lighter band) -->
  <rect x="34" y="11" width="26" height="1.6" fill="#3a3a3a"/>
  <!-- Coal lumps in the tender, with sheen highlights -->
  <g fill="#000">
    <circle cx="38" cy="13" r="1.4"/>
    <circle cx="42" cy="12.5" r="1.6"/>
    <circle cx="46" cy="13" r="1.4"/>
    <circle cx="50" cy="12.6" r="1.5"/>
    <circle cx="54" cy="13" r="1.4"/>
    <circle cx="58" cy="12.6" r="1.3"/>
  </g>
  <g fill="#7a7a7a" opacity="0.65">
    <circle cx="37.5" cy="12.5" r="0.4"/>
    <circle cx="41.5" cy="12" r="0.5"/>
    <circle cx="49.5" cy="12.1" r="0.5"/>
    <circle cx="57.5" cy="12.1" r="0.4"/>
  </g>
  <!-- Tender vertical rivet straps -->
  <g fill="#0a0a0a">
    <rect x="40" y="14" width="0.7" height="9"/>
    <rect x="48" y="14" width="0.7" height="9"/>
    <rect x="56" y="14" width="0.7" height="9"/>
  </g>

  <!-- ==== Cab ==== -->
  <rect x="22" y="6" width="13" height="18"
        fill="url(#loco-body)" stroke="#000" stroke-width="0.6"/>
  <!-- Cab roof overhang (lighter top) -->
  <rect x="20" y="5" width="17" height="2" rx="0.5"
        fill="#0a0a0a" stroke="#000" stroke-width="0.4"/>
  <line x1="20" y1="5.4" x2="37" y2="5.4" stroke="#5a5a5a" stroke-width="0.3"/>
  <!-- Cab window -->
  <rect x="25" y="9" width="7" height="6" fill="#3a3a3a"
        stroke="#000" stroke-width="0.4"/>
  <line x1="28.5" y1="9" x2="28.5" y2="15" stroke="#000" stroke-width="0.3"/>
  <!-- Cab side rivets -->
  <g fill="#7a7a7a" opacity="0.55">
    <circle cx="23.5" cy="17" r="0.4"/>
    <circle cx="33.5" cy="17" r="0.4"/>
    <circle cx="23.5" cy="22" r="0.4"/>
    <circle cx="33.5" cy="22" r="0.4"/>
  </g>

  <!-- ==== Boiler (cylindrical) ==== -->
  <!-- Boiler bottom band (darker) -->
  <rect x="3" y="11" width="22" height="13" rx="2"
        fill="url(#loco-body)" stroke="#000" stroke-width="0.6"/>
  <!-- Boiler curved top highlight (suggests cylinder) -->
  <path d="M 3 12.5 Q 14 10 25 12.5 L 25 14 Q 14 12 3 14 Z"
        fill="url(#loco-boiler-top)" opacity="0.95"/>
  <!-- Boiler bands -->
  <line x1="9"  y1="11" x2="9"  y2="24" stroke="#000" stroke-width="0.45"/>
  <line x1="15" y1="11" x2="15" y2="24" stroke="#000" stroke-width="0.45"/>
  <line x1="21" y1="11" x2="21" y2="24" stroke="#000" stroke-width="0.45"/>
  <!-- Band rivets -->
  <g fill="#7a7a7a" opacity="0.55">
    <circle cx="9" cy="13" r="0.35"/>
    <circle cx="9" cy="22" r="0.35"/>
    <circle cx="15" cy="13" r="0.35"/>
    <circle cx="15" cy="22" r="0.35"/>
    <circle cx="21" cy="13" r="0.35"/>
    <circle cx="21" cy="22" r="0.35"/>
  </g>

  <!-- ==== Smokebox front + door ==== -->
  <circle cx="5" cy="17.5" r="3.2" fill="#1a1a1a"
          stroke="#000" stroke-width="0.5"/>
  <circle cx="5" cy="17.5" r="2" fill="#2a2a2a"/>
  <!-- Smokebox door hinges + handle -->
  <circle cx="5" cy="17.5" r="0.8" fill="#7a7a7a"/>
  <line x1="3.5" y1="17.5" x2="6.5" y2="17.5" stroke="#5a5a5a" stroke-width="0.3"/>
  <line x1="5" y1="16" x2="5" y2="19" stroke="#5a5a5a" stroke-width="0.3"/>

  <!-- ==== Chimney + steam dome ==== -->
  <!-- Chimney base flare -->
  <rect x="6.4" y="9" width="4.4" height="2" fill="#0a0a0a"
        stroke="#000" stroke-width="0.4"/>
  <!-- Chimney stack -->
  <rect x="7" y="5" width="3.2" height="6" fill="#0a0a0a"
        stroke="#000" stroke-width="0.4"/>
  <!-- Chimney top rim -->
  <ellipse cx="8.6" cy="5" rx="2.2" ry="0.8"
           fill="#1f1f1f" stroke="#000" stroke-width="0.4"/>
  <ellipse cx="8.6" cy="5" rx="1.6" ry="0.5" fill="#0a0a0a"/>
  <!-- Steam dome (round bell on the boiler) -->
  <ellipse cx="14" cy="9.5" rx="2.2" ry="2.2"
           fill="#1a1a1a" stroke="#000" stroke-width="0.4"/>
  <ellipse cx="14" cy="9" rx="1.8" ry="0.8" fill="#3a3a3a" opacity="0.7"/>
  <!-- Sand dome (smaller bell aft of steam dome) -->
  <ellipse cx="19" cy="10" rx="1.5" ry="1.5"
           fill="#1a1a1a" stroke="#000" stroke-width="0.4"/>

  <!-- ==== Wheels ==== -->
  <!-- Driving wheels (large) -->
  <circle cx="7"  cy="24" r="3" fill="url(#loco-wheel)" stroke="#000" stroke-width="0.5"/>
  <circle cx="14" cy="24" r="3" fill="url(#loco-wheel)" stroke="#000" stroke-width="0.5"/>
  <circle cx="21" cy="24" r="3" fill="url(#loco-wheel)" stroke="#000" stroke-width="0.5"/>
  <!-- Spokes -->
  <g stroke="#7a7a7a" stroke-width="0.3" opacity="0.85">
    <line x1="7" y1="21.5" x2="7" y2="26.5"/>
    <line x1="4.5" y1="24" x2="9.5" y2="24"/>
    <line x1="14" y1="21.5" x2="14" y2="26.5"/>
    <line x1="11.5" y1="24" x2="16.5" y2="24"/>
    <line x1="21" y1="21.5" x2="21" y2="26.5"/>
    <line x1="18.5" y1="24" x2="23.5" y2="24"/>
  </g>
  <!-- Hubs -->
  <circle cx="7"  cy="24" r="0.8" fill="#5a5a5a"/>
  <circle cx="14" cy="24" r="0.8" fill="#5a5a5a"/>
  <circle cx="21" cy="24" r="0.8" fill="#5a5a5a"/>
  <!-- Coupling rod -->
  <rect x="6" y="23.6" width="16" height="0.7" fill="#7a7a7a" opacity="0.85"/>

  <!-- Tender wheels (small) -->
  <circle cx="38" cy="25" r="2.2" fill="url(#loco-wheel)" stroke="#000" stroke-width="0.5"/>
  <circle cx="46" cy="25" r="2.2" fill="url(#loco-wheel)" stroke="#000" stroke-width="0.5"/>
  <circle cx="54" cy="25" r="2.2" fill="url(#loco-wheel)" stroke="#000" stroke-width="0.5"/>
  <circle cx="38" cy="25" r="0.6" fill="#5a5a5a"/>
  <circle cx="46" cy="25" r="0.6" fill="#5a5a5a"/>
  <circle cx="54" cy="25" r="0.6" fill="#5a5a5a"/>
</svg>
