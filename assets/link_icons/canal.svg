<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 28">
  <!-- Wooden canal narrowboat with cargo crates. Hull tapered fore
       and aft, plank bands across the side, a small cabin at the
       stern, and three crates of coal amidships. -->

  <defs>
    <linearGradient id="canal-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5030"/>
      <stop offset="0.5" stop-color="#4e3218"/>
      <stop offset="1" stop-color="#281404"/>
    </linearGradient>
    <linearGradient id="canal-cargo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6238"/>
      <stop offset="1" stop-color="#3a2110"/>
    </linearGradient>
  </defs>

  <!-- Hull silhouette: pointed bow on the left, flat-ish stern on the
       right. Two paths so we can stack the deck plank above the
       hull's lower curve. -->
  <path d="M 4 12 L 8 8 L 56 8 L 60 12 L 60 22 Q 56 26 48 26 L 12 26 Q 6 26 4 22 Z"
        fill="url(#canal-hull)" stroke="#1a0c04" stroke-width="0.7"/>

  <!-- Plank bands -->
  <line x1="6"  y1="14" x2="58" y2="14" stroke="#1a0c04" stroke-width="0.4"/>
  <line x1="6"  y1="18" x2="58" y2="18" stroke="#1a0c04" stroke-width="0.4"/>
  <line x1="6"  y1="22" x2="58" y2="22" stroke="#1a0c04" stroke-width="0.4"/>

  <!-- Deck plate (dark band at the very top of the hull) -->
  <path d="M 6 9 L 58 9 L 58 12 L 6 12 Z" fill="#1f140a"/>

  <!-- Three cargo crates on the deck, each with a hint of coal -->
  <g stroke="#1a0c04" stroke-width="0.45">
    <rect x="14" y="3"  width="9" height="8" fill="url(#canal-cargo)"/>
    <rect x="26" y="3"  width="9" height="8" fill="url(#canal-cargo)"/>
    <rect x="38" y="3"  width="9" height="8" fill="url(#canal-cargo)"/>
  </g>
  <!-- Coal nuggets peeking out of each crate -->
  <g fill="#0a0a0a">
    <circle cx="16" cy="4.5" r="0.7"/>
    <circle cx="18.6" cy="4.2" r="0.8"/>
    <circle cx="21" cy="4.5" r="0.7"/>
    <circle cx="28" cy="4.5" r="0.7"/>
    <circle cx="30.6" cy="4.2" r="0.8"/>
    <circle cx="33" cy="4.5" r="0.7"/>
    <circle cx="40" cy="4.5" r="0.7"/>
    <circle cx="42.6" cy="4.2" r="0.8"/>
    <circle cx="45" cy="4.5" r="0.7"/>
  </g>

  <!-- Stern cabin / steerer's box -->
  <rect x="49" y="4" width="8" height="7" fill="#3a2110" stroke="#1a0c04" stroke-width="0.5"/>
  <rect x="51" y="6" width="4" height="3" fill="#9a8050" stroke="#1a0c04" stroke-width="0.3"/>

  <!-- Tiller arm at the stern -->
  <line x1="57" y1="9" x2="62" y2="6" stroke="#1a0c04" stroke-width="0.6" stroke-linecap="round"/>
</svg>
