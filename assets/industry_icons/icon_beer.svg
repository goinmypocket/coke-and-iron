<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Brewery industry icon: three barrels laid on their sides, two on
       the base and one balanced on top forming a triangular stack.
       Deliberately different from the single-barrel BEER RESOURCE glyph
       so you can tell a brewery INDUSTRY (a place that produces beer)
       from a brewery's BEER OUTPUT at a glance. -->

  <defs>
    <!-- Stave gradient: bright highlight top-left, deep shadow bottom-
         right so every barrel reads as round. -->
    <linearGradient id="stave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E29B4A"/>
      <stop offset="0.5" stop-color="#B97530"/>
      <stop offset="1" stop-color="#6E3F12"/>
    </linearGradient>
    <!-- End-cap gradient so the circular barrel end looks hollowed. -->
    <radialGradient id="end" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#C98A48"/>
      <stop offset="0.7" stop-color="#7A4818"/>
      <stop offset="1" stop-color="#3A1F08"/>
    </radialGradient>
    <linearGradient id="hoop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3018"/>
      <stop offset="1" stop-color="#1A0C04"/>
    </linearGradient>
  </defs>

  <!-- Shadow under the stack so the barrels sit on a surface -->
  <ellipse cx="64" cy="112" rx="52" ry="6" fill="#1A1A1A" opacity="0.28"/>

  <!-- Helper: each barrel is a rounded rect body + two end caps at the
       sides + four iron hoops. Drawn back-to-front: top barrel LAST. -->

  <!-- Base barrel LEFT (x=4..62, y=64..112) -->
  <rect x="10" y="70" width="52" height="38" rx="6"
        fill="url(#stave)" stroke="#1F0F04" stroke-width="2"/>
  <!-- Stave seams -->
  <g stroke="#2A1507" stroke-width="1.1" opacity="0.55" fill="none">
    <line x1="10" y1="78" x2="62" y2="78"/>
    <line x1="10" y1="89" x2="62" y2="89"/>
    <line x1="10" y1="100" x2="62" y2="100"/>
  </g>
  <!-- Iron hoops -->
  <rect x="10" y="75" width="52" height="4" fill="url(#hoop)"/>
  <rect x="10" y="97" width="52" height="4" fill="url(#hoop)"/>
  <!-- End cap LEFT -->
  <ellipse cx="10" cy="89" rx="7" ry="18" fill="url(#end)"
           stroke="#1F0F04" stroke-width="2"/>
  <circle cx="10" cy="89" r="2" fill="#1A0C04"/>
  <!-- End cap RIGHT -->
  <ellipse cx="62" cy="89" rx="7" ry="18" fill="url(#end)"
           stroke="#1F0F04" stroke-width="2"/>

  <!-- Base barrel RIGHT (x=66..118, y=70..108) — offset overlap with
       left barrel so the two read as touching -->
  <rect x="66" y="70" width="52" height="38" rx="6"
        fill="url(#stave)" stroke="#1F0F04" stroke-width="2"/>
  <g stroke="#2A1507" stroke-width="1.1" opacity="0.55" fill="none">
    <line x1="66" y1="78" x2="118" y2="78"/>
    <line x1="66" y1="89" x2="118" y2="89"/>
    <line x1="66" y1="100" x2="118" y2="100"/>
  </g>
  <rect x="66" y="75" width="52" height="4" fill="url(#hoop)"/>
  <rect x="66" y="97" width="52" height="4" fill="url(#hoop)"/>
  <ellipse cx="66" cy="89" rx="7" ry="18" fill="url(#end)"
           stroke="#1F0F04" stroke-width="2"/>
  <circle cx="66" cy="89" r="2" fill="#1A0C04"/>
  <ellipse cx="118" cy="89" rx="7" ry="18" fill="url(#end)"
           stroke="#1F0F04" stroke-width="2"/>

  <!-- Top barrel (centred on the seam between the two base barrels) -->
  <rect x="38" y="28" width="52" height="38" rx="6"
        fill="url(#stave)" stroke="#1F0F04" stroke-width="2"/>
  <g stroke="#2A1507" stroke-width="1.1" opacity="0.55" fill="none">
    <line x1="38" y1="36" x2="90" y2="36"/>
    <line x1="38" y1="47" x2="90" y2="47"/>
    <line x1="38" y1="58" x2="90" y2="58"/>
  </g>
  <rect x="38" y="33" width="52" height="4" fill="url(#hoop)"/>
  <rect x="38" y="55" width="52" height="4" fill="url(#hoop)"/>
  <ellipse cx="38" cy="47" rx="7" ry="18" fill="url(#end)"
           stroke="#1F0F04" stroke-width="2"/>
  <circle cx="38" cy="47" r="2" fill="#1A0C04"/>
  <ellipse cx="90" cy="47" rx="7" ry="18" fill="url(#end)"
           stroke="#1F0F04" stroke-width="2"/>

  <!-- Highlight gleam on the top barrel so the eye reads the peak of
       the triangle first -->
  <path d="M46 30 Q42 38 46 56" fill="none" stroke="#F2BA7A"
        stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</svg>
