<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Manufacturer industry icon: wooden shipping crate.
       BBox: (14, 14) → (114, 114) — 100×100 centered with 14u padding.
       Depth offset: (+24, -12) — shared with cotton, coal cart, iron
       plinth so every 3D face slopes the same way.
       Geometry:
         Front: (14, 26) → (90, 114)            76 wide × 88 tall
         Top:   (14,26) (90,26) (114,14) (38,14)
         Side:  (90,26) (114,14) (114,102) (90,114) -->

  <defs>
    <linearGradient id="mfg-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C99A66"/>
      <stop offset="0.55" stop-color="#92682E"/>
      <stop offset="1" stop-color="#5A3A18"/>
    </linearGradient>
    <linearGradient id="mfg-top" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#E8B884"/>
      <stop offset="1" stop-color="#A07840"/>
    </linearGradient>
    <linearGradient id="mfg-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A3818"/>
      <stop offset="1" stop-color="#321C08"/>
    </linearGradient>
    <linearGradient id="mfg-iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2814"/>
      <stop offset="1" stop-color="#0A0604"/>
    </linearGradient>
  </defs>

  <!-- Side face -->
  <polygon points="90,26 114,14 114,102 90,114"
           fill="url(#mfg-side)" stroke="#100804" stroke-width="2"/>
  <g stroke="#0A0402" stroke-width="0.9" opacity="0.85">
    <line x1="90" y1="48" x2="114" y2="36"/>
    <line x1="90" y1="70" x2="114" y2="58"/>
    <line x1="90" y1="92" x2="114" y2="80"/>
  </g>
  <line x1="90" y1="26" x2="114" y2="14" stroke="#9A6E40"
        stroke-width="1" opacity="0.7"/>

  <!-- Top face -->
  <polygon points="14,26 90,26 114,14 38,14"
           fill="url(#mfg-top)" stroke="#100804" stroke-width="2"/>
  <g stroke="#5A3818" stroke-width="0.8" opacity="0.85">
    <line x1="33" y1="26" x2="57" y2="14"/>
    <line x1="52" y1="26" x2="76" y2="14"/>
    <line x1="71" y1="26" x2="95" y2="14"/>
  </g>
  <line x1="14" y1="26" x2="90" y2="26" stroke="#F8D6A0"
        stroke-width="1.4" opacity="0.85"/>

  <!-- Front face -->
  <rect x="14" y="26" width="76" height="88"
        fill="url(#mfg-front)" stroke="#100804" stroke-width="2.2"/>
  <g stroke="#1A0A04" stroke-width="1.2">
    <line x1="33" y1="26" x2="33" y2="114"/>
    <line x1="52" y1="26" x2="52" y2="114"/>
    <line x1="71" y1="26" x2="71" y2="114"/>
  </g>
  <g stroke="#E8B884" stroke-width="0.7" opacity="0.55">
    <line x1="23" y1="32" x2="23" y2="108"/>
    <line x1="42" y1="32" x2="42" y2="108"/>
    <line x1="61" y1="32" x2="61" y2="108"/>
    <line x1="80" y1="32" x2="80" y2="108"/>
  </g>
  <g fill="#3A1F08" opacity="0.55">
    <ellipse cx="23" cy="50" rx="2.6" ry="1.2"/>
    <ellipse cx="58" cy="42" rx="2.4" ry="1.1"/>
    <ellipse cx="76" cy="84" rx="2.6" ry="1.2"/>
  </g>

  <!-- Iron straps along visible edges of front face -->
  <rect x="13" y="24" width="78" height="4" fill="url(#mfg-iron)"/>
  <rect x="13" y="110" width="78" height="4" fill="url(#mfg-iron)"/>
  <rect x="13" y="24" width="6" height="90" fill="url(#mfg-iron)"/>
  <rect x="85" y="24" width="6" height="90" fill="url(#mfg-iron)"/>
  <!-- Iron strap along the top-right edge (top-face / side-face seam) -->
  <polygon points="90,22 114,10 114,14 90,26" fill="url(#mfg-iron)"/>
  <!-- Iron strap along the back-right vertical edge -->
  <polygon points="112,14 116,14 116,102 112,102" fill="url(#mfg-iron)"/>

  <!-- Rivets -->
  <g fill="#C88C44">
    <circle cx="16" cy="28" r="1.6"/>
    <circle cx="88" cy="28" r="1.6"/>
    <circle cx="16" cy="112" r="1.6"/>
    <circle cx="88" cy="112" r="1.6"/>
    <circle cx="114" cy="16" r="1.4"/>
    <circle cx="114" cy="100" r="1.4"/>
  </g>

  <!-- Stencilled "M" on front face — centred at (52, 70), 32w × 38t -->
  <path d="M36 89 L36 51 L52 75 L68 51 L68 89"
        fill="none" stroke="#1A0A04" stroke-width="4.4"
        stroke-linecap="round" stroke-linejoin="round"
        opacity="0.85"/>
  <path d="M36 89 L36 51 L52 75 L68 51 L68 89"
        fill="none" stroke="#F0CFA0" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"
        opacity="0.4"/>
</svg>
