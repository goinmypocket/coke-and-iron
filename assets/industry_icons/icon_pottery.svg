<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Pottery industry icon: Stoke-style bottle oven, scaled to fill
       the shared 100×100 bbox (14..114 in both axes) and centred on
       the icon's vertical axis (x=64). Distinctive bottle silhouette:
       narrow neck at the top, swelling to a wide belly, slightly
       waisting to a wide base. Brick courses curve around the body
       to suggest the round form. -->

  <defs>
    <linearGradient id="kiln-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9C5232"/>
      <stop offset="0.4" stop-color="#A85A38"/>
      <stop offset="0.7" stop-color="#6E3018"/>
      <stop offset="1" stop-color="#3A140A"/>
    </linearGradient>
    <linearGradient id="kiln-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A2410"/>
      <stop offset="1" stop-color="#2A0E04"/>
    </linearGradient>
  </defs>

  <!-- Smoke wisps (drawn first, behind the cap) -->
  <g fill="#C8C8C8" opacity="0.5">
    <ellipse cx="62" cy="10" rx="5" ry="3.5"/>
    <ellipse cx="68" cy="6" rx="3.5" ry="2.5"/>
  </g>

  <!-- Bottle kiln silhouette: neck at top (x ∈ [56, 72], y=16),
       shoulders curving out to a wide belly (x ∈ [14, 114] at the
       widest point around y=84), narrowing slightly to the base
       (x ∈ [22, 106] at y=114). Centred on x=64. -->
  <path d="M 56 16
           Q 48 30 46 42
           Q 22 60 16 84
           Q 14 104 22 114
           L 106 114
           Q 114 104 112 84
           Q 106 60 82 42
           Q 80 30 72 16 Z"
        fill="url(#kiln-body)" stroke="#1A0604" stroke-width="2.2"/>

  <!-- Brick courses curving around the bulged body. Each Q-curve
       follows the bottle profile so the bricks read as wrapping a
       round form. -->
  <g stroke="#3A1208" stroke-width="0.6" opacity="0.85" fill="none">
    <path d="M 50 26 Q 64 28 78 26"/>
    <path d="M 47 36 Q 64 40 81 36"/>
    <path d="M 40 46 Q 64 50 88 46"/>
    <path d="M 30 56 Q 64 60 98 56"/>
    <path d="M 22 66 Q 64 70 106 66"/>
    <path d="M 17 76 Q 64 80 111 76"/>
    <path d="M 15 86 Q 64 90 113 86"/>
    <path d="M 16 96 Q 64 100 112 96"/>
    <path d="M 19 106 Q 64 110 109 106"/>
  </g>

  <!-- Vertical brick joints (offset every other course) -->
  <g stroke="#3A1208" stroke-width="0.4" opacity="0.65">
    <line x1="44" y1="46" x2="44" y2="56"/>
    <line x1="56" y1="46" x2="56" y2="56"/>
    <line x1="64" y1="46" x2="64" y2="56"/>
    <line x1="72" y1="46" x2="72" y2="56"/>
    <line x1="84" y1="46" x2="84" y2="56"/>
    <line x1="36" y1="56" x2="36" y2="66"/>
    <line x1="48" y1="56" x2="48" y2="66"/>
    <line x1="60" y1="56" x2="60" y2="66"/>
    <line x1="68" y1="56" x2="68" y2="66"/>
    <line x1="80" y1="56" x2="80" y2="66"/>
    <line x1="92" y1="56" x2="92" y2="66"/>
    <line x1="26" y1="66" x2="26" y2="76"/>
    <line x1="40" y1="66" x2="40" y2="76"/>
    <line x1="56" y1="66" x2="56" y2="76"/>
    <line x1="64" y1="66" x2="64" y2="76"/>
    <line x1="72" y1="66" x2="72" y2="76"/>
    <line x1="88" y1="66" x2="88" y2="76"/>
    <line x1="102" y1="66" x2="102" y2="76"/>
    <line x1="22" y1="76" x2="22" y2="86"/>
    <line x1="36" y1="76" x2="36" y2="86"/>
    <line x1="50" y1="76" x2="50" y2="86"/>
    <line x1="64" y1="76" x2="64" y2="86"/>
    <line x1="78" y1="76" x2="78" y2="86"/>
    <line x1="92" y1="76" x2="92" y2="86"/>
    <line x1="106" y1="76" x2="106" y2="86"/>
    <line x1="20" y1="86" x2="20" y2="96"/>
    <line x1="34" y1="86" x2="34" y2="96"/>
    <line x1="48" y1="86" x2="48" y2="96"/>
    <line x1="60" y1="86" x2="60" y2="96"/>
    <line x1="72" y1="86" x2="72" y2="96"/>
    <line x1="84" y1="86" x2="84" y2="96"/>
    <line x1="98" y1="86" x2="98" y2="96"/>
    <line x1="108" y1="86" x2="108" y2="96"/>
  </g>

  <!-- Top vent ring (chimney mouth) -->
  <ellipse cx="64" cy="16" rx="9" ry="3"
           fill="url(#kiln-cap)" stroke="#0A0402" stroke-width="1.2"/>
  <ellipse cx="64" cy="16" rx="5" ry="1.8" fill="#1A0604"/>
  <path d="M 56 15 Q 64 12 72 15" stroke="#C26840"
        stroke-width="0.9" fill="none" opacity="0.7"/>

  <!-- Stoking arch at the base + interior glow -->
  <path d="M 54 114 L 54 100 Q 54 92 64 92 Q 74 92 74 100 L 74 114 Z"
        fill="#0A0402" stroke="#000" stroke-width="0.8"/>
  <ellipse cx="64" cy="108" rx="6" ry="3.5" fill="#E08A30" opacity="0.55"/>
  <ellipse cx="64" cy="106" rx="4" ry="2" fill="#F8C470" opacity="0.7"/>

  <!-- Lit-side highlight along the body -->
  <path d="M 42 36 Q 22 70 22 102" stroke="#D89060"
        stroke-width="2.6" fill="none" stroke-linecap="round"
        opacity="0.55"/>
</svg>
