<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Pottery industry icon: tall amphora urn with narrow neck, bulbous
       body, stepped foot, two side handles, and decorative bands. Deep
       red-clay glaze with inner shading. -->

  <defs>
    <linearGradient id="clay-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B04848"/>
      <stop offset="0.5" stop-color="#7A2A2A"/>
      <stop offset="1" stop-color="#3E1010"/>
    </linearGradient>
    <linearGradient id="clay-neck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B85050"/>
      <stop offset="1" stop-color="#4A1818"/>
    </linearGradient>
    <radialGradient id="lip" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#2A0A0A"/>
      <stop offset="1" stop-color="#6A2020"/>
    </radialGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="118" rx="44" ry="5" fill="#1A1A1A" opacity="0.3"/>

  <!-- Side handles drawn first so the body covers their inner curve -->
  <path d="M34 52 Q16 56 20 72 Q20 88 36 92"
        fill="none" stroke="#3E1010" stroke-width="5"
        stroke-linecap="round"/>
  <path d="M94 52 Q112 56 108 72 Q108 88 92 92"
        fill="none" stroke="#3E1010" stroke-width="5"
        stroke-linecap="round"/>

  <!-- Main amphora body -->
  <path d="M40 108 Q28 80 34 50 Q42 30 50 26 L78 26 Q86 30 94 50
           Q100 80 88 108 Z"
        fill="url(#clay-body)" stroke="#2A0A0A" stroke-width="2.5"/>

  <!-- Neck section -->
  <rect x="48" y="16" width="32" height="14" rx="3"
        fill="url(#clay-neck)" stroke="#2A0A0A" stroke-width="2.2"/>
  <!-- Rim lip -->
  <ellipse cx="64" cy="17" rx="18" ry="4"
           fill="url(#lip)" stroke="#2A0A0A" stroke-width="2"/>

  <!-- Decorative bands around the belly -->
  <path d="M36 60 Q64 64 92 60" stroke="#2A0A0A" stroke-width="2"
        fill="none"/>
  <path d="M36 68 Q64 72 92 68" stroke="#2A0A0A" stroke-width="2"
        fill="none"/>
  <!-- Diamond motif between the bands -->
  <g fill="#D67878">
    <polygon points="46,64 50,62 54,64 50,66"/>
    <polygon points="56,64 60,62 64,64 60,66"/>
    <polygon points="66,64 70,62 74,64 70,66"/>
    <polygon points="76,64 80,62 84,64 80,66"/>
  </g>

  <!-- Lower band -->
  <path d="M33 88 Q64 92 95 88" stroke="#2A0A0A" stroke-width="2"
        fill="none"/>
  <!-- Meander / key pattern across the lower band -->
  <g stroke="#D67878" stroke-width="1.2" fill="none">
    <path d="M40 92 h3 v3 h-3 z"/>
    <path d="M50 92 h3 v3 h-3 z"/>
    <path d="M60 92 h3 v3 h-3 z"/>
    <path d="M70 92 h3 v3 h-3 z"/>
    <path d="M80 92 h3 v3 h-3 z"/>
  </g>

  <!-- Stepped foot -->
  <rect x="36" y="108" width="56" height="6" rx="2"
        fill="#2A0A0A" stroke="#1A0404" stroke-width="1.4"/>
  <rect x="42" y="114" width="44" height="4" fill="#1A0404"/>

  <!-- Highlight streak for ceramic sheen -->
  <path d="M44 32 Q38 64 44 100" stroke="#E89090" stroke-width="2.6"
        fill="none" stroke-linecap="round" opacity="0.55"/>
</svg>
