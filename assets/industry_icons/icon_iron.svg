<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Iron works industry icon: classic blacksmith anvil with a step-
       tapered horn, stepped base, polished top face, rivets, and hammer
       strike marks. Gradients give it a forged steel look. -->

  <defs>
    <linearGradient id="anvil-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9E9E9E"/>
      <stop offset="0.4" stop-color="#6A6A6A"/>
      <stop offset="1" stop-color="#3A3A3A"/>
    </linearGradient>
    <linearGradient id="anvil-waist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4A4A"/>
      <stop offset="1" stop-color="#1E1E1E"/>
    </linearGradient>
    <linearGradient id="anvil-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2E2E"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <radialGradient id="stump" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#6E4A2A"/>
      <stop offset="1" stop-color="#2A1A0A"/>
    </radialGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="64" cy="118" rx="52" ry="5" fill="#1A1A1A" opacity="0.28"/>

  <!-- Wooden stump under the anvil -->
  <rect x="26" y="98" width="76" height="16" fill="url(#stump)"
        stroke="#1A0A04" stroke-width="2"/>
  <!-- Plank lines on stump -->
  <g stroke="#3A2414" stroke-width="1" opacity="0.7">
    <line x1="44" y1="98" x2="44" y2="114"/>
    <line x1="64" y1="98" x2="64" y2="114"/>
    <line x1="84" y1="98" x2="84" y2="114"/>
  </g>

  <!-- Anvil top face + tapered horn -->
  <path d="M10 44 L24 32 L108 32 L108 44 Z"
        fill="url(#anvil-top)" stroke="#0A0A0A" stroke-width="2.2"/>
  <!-- Polished face highlight -->
  <rect x="28" y="33.5" width="78" height="3" fill="#D0D0D0" opacity="0.8"/>
  <!-- Hardy hole -->
  <rect x="84" y="36" width="5" height="3.5" fill="#060606"/>
  <!-- Hammer strike divots -->
  <g stroke="#2A2A2A" stroke-width="1" opacity="0.8">
    <line x1="40" y1="37" x2="46" y2="37"/>
    <line x1="52" y1="37" x2="58" y2="37"/>
    <line x1="64" y1="37" x2="70" y2="37"/>
  </g>

  <!-- Waist -->
  <polygon points="26,44 98,44 90,70 34,70"
           fill="url(#anvil-waist)" stroke="#0A0A0A" stroke-width="2"/>

  <!-- Stepped base: upper ledge + wider foot -->
  <rect x="22" y="70" width="80" height="12"
        fill="url(#anvil-base)" stroke="#0A0A0A" stroke-width="2"/>
  <rect x="14" y="82" width="96" height="16"
        fill="url(#anvil-base)" stroke="#0A0A0A" stroke-width="2"/>

  <!-- Rivets on the base -->
  <g fill="#7A7A7A">
    <circle cx="24" cy="90" r="1.8"/>
    <circle cx="46" cy="90" r="1.8"/>
    <circle cx="68" cy="90" r="1.8"/>
    <circle cx="90" cy="90" r="1.8"/>
    <circle cx="108" cy="90" r="1.8"/>
  </g>

  <!-- Subtle horn highlight so the left side reads as the tapered end -->
  <path d="M12 42 L22 34 L28 32" stroke="#C0C0C0" stroke-width="1.5"
        fill="none"/>
</svg>
