<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Iron works industry icon: beam (rocking) engine.
       BBox: (14, 14) → (114, 114) — 100×100.
       Plinth depth offset: (+24, -12) — same direction as the
       manufacturer crate, cotton mill, and coal cart.
       Geometry:
         Plinth front: (14, 80) → (90, 110)        76 wide × 30 tall
         Plinth top:   (14,80) (90,80) (114,68) (38,68)
         Plinth side:  (90,80) (114,68) (114,98) (90,110)
         A-frame:      from plinth at x=36 / x=66, converging at top
         Beam:         horizontal at y ≈ 22, x ∈ [14, 104]
         Cylinder:     vertical, x ∈ [14, 28], y ∈ [30, 74]
         Flywheel:     r=18, centred at (88, 50) -->

  <defs>
    <linearGradient id="iron-plinth-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A6E3E"/>
      <stop offset="0.55" stop-color="#5A3818"/>
      <stop offset="1" stop-color="#2A1808"/>
    </linearGradient>
    <linearGradient id="iron-plinth-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A2410"/>
      <stop offset="1" stop-color="#1A0E04"/>
    </linearGradient>
    <linearGradient id="iron-plinth-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B88450"/>
      <stop offset="1" stop-color="#7A4A20"/>
    </linearGradient>
    <linearGradient id="iron-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A4F2A"/>
      <stop offset="1" stop-color="#2A1808"/>
    </linearGradient>
    <linearGradient id="iron-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C5C5C"/>
      <stop offset="0.5" stop-color="#2A2A2A"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <radialGradient id="iron-wheel" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#7A7A7A"/>
      <stop offset="0.6" stop-color="#1E1E1E"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="iron-cylinder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E6E6E"/>
      <stop offset="0.5" stop-color="#2A2A2A"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
  </defs>

  <!-- ==== Plinth: 3 visible faces using the shared depth offset ==== -->
  <polygon points="90,80 114,68 114,98 90,110"
           fill="url(#iron-plinth-side)" stroke="#0A0402" stroke-width="1.6"/>
  <polygon points="14,80 90,80 114,68 38,68"
           fill="url(#iron-plinth-top)" stroke="#0A0402" stroke-width="1.6"/>
  <rect x="14" y="80" width="76" height="30"
        fill="url(#iron-plinth-front)" stroke="#0A0402" stroke-width="2"/>
  <g stroke="#1A0E04" stroke-width="0.9" opacity="0.85">
    <line x1="33" y1="80" x2="33" y2="110"/>
    <line x1="52" y1="80" x2="52" y2="110"/>
    <line x1="71" y1="80" x2="71" y2="110"/>
  </g>
  <g stroke="#C68F5C" stroke-width="0.6" opacity="0.45">
    <line x1="22" y1="84" x2="22" y2="106"/>
    <line x1="42" y1="84" x2="42" y2="106"/>
    <line x1="60" y1="84" x2="60" y2="106"/>
    <line x1="80" y1="84" x2="80" y2="106"/>
  </g>

  <!-- ==== Timber A-frame ==== -->
  <polygon points="34,80 50,28 56,28 42,80"
           fill="url(#iron-frame)" stroke="#0A0402" stroke-width="1.6"/>
  <polygon points="74,80 64,28 58,28 70,80"
           fill="url(#iron-frame)" stroke="#0A0402" stroke-width="1.6"/>
  <rect x="40" y="54" width="32" height="4"
        fill="#1A0E04" stroke="#0A0402" stroke-width="0.8"
        transform="rotate(-2 56 56)"/>
  <line x1="42" y1="74" x2="68" y2="42" stroke="#1A0E04" stroke-width="2"/>
  <g fill="#C08840">
    <circle cx="50" cy="56" r="1.4"/>
    <circle cx="62" cy="56" r="1.4"/>
    <circle cx="38" cy="74" r="1.4"/>
    <circle cx="74" cy="74" r="1.4"/>
  </g>

  <!-- ==== Horizontal rocking beam ==== -->
  <polygon points="14,18 104,14 106,28 16,32"
           fill="url(#iron-beam)" stroke="#000" stroke-width="1.6"/>
  <rect x="42" y="20" width="32" height="6" fill="#0A0A0A"
        stroke="#000" stroke-width="0.6"/>
  <circle cx="56" cy="24" r="3.6" fill="#7A7A7A"
          stroke="#000" stroke-width="1"/>
  <circle cx="56" cy="24" r="1.4" fill="#1A1A1A"/>

  <!-- ==== Piston cylinder (vertical, lower-left of beam end) ==== -->
  <line x1="18" y1="26" x2="22" y2="46" stroke="#1A1A1A"
        stroke-width="3" stroke-linecap="round"/>
  <rect x="14" y="46" width="14" height="32" rx="2.5"
        fill="url(#iron-cylinder)" stroke="#000" stroke-width="1.4"/>
  <rect x="12" y="44" width="18" height="4" rx="1.2"
        fill="#1A1A1A" stroke="#000" stroke-width="0.8"/>
  <rect x="12" y="76" width="18" height="4" rx="1.2"
        fill="#1A1A1A" stroke="#000" stroke-width="0.8"/>
  <line x1="17" y1="48" x2="17" y2="76" stroke="#9A9A9A"
        stroke-width="1.4" opacity="0.7"/>

  <!-- ==== Flywheel ==== -->
  <circle cx="88" cy="50" r="20"
          fill="url(#iron-wheel)" stroke="#000" stroke-width="2"/>
  <circle cx="88" cy="50" r="15" fill="none"
          stroke="#1A1A1A" stroke-width="1.4"/>
  <circle cx="88" cy="50" r="4" fill="#7A7A7A"
          stroke="#000" stroke-width="1"/>
  <circle cx="88" cy="50" r="1.4" fill="#1A1A1A"/>
  <g stroke="#9A9A9A" stroke-width="1.6" opacity="0.85">
    <line x1="88" y1="30" x2="88" y2="70"/>
    <line x1="68" y1="50" x2="108" y2="50"/>
    <line x1="74" y1="36" x2="102" y2="64"/>
    <line x1="102" y1="36" x2="74" y2="64"/>
  </g>
  <path d="M 76 36 A 20 20 0 0 1 98 32" stroke="#A0A0A0"
        stroke-width="1.4" fill="none" opacity="0.7"/>
  <!-- Connecting rod from flywheel rim to beam -->
  <line x1="88" y1="30" x2="88" y2="18" stroke="#1A1A1A"
        stroke-width="3" stroke-linecap="round"/>
  <circle cx="88" cy="30" r="1.6" fill="#7A7A7A"
          stroke="#000" stroke-width="0.6"/>
</svg>
